<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Code Review & Rewrite Agent 🤖</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/monokai-sublime.min.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="bg-gray-900 text-gray-100">
    <div class="min-h-screen p-8">
      <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-4">AI Code Review & Rewrite Agent 🤖</h1>
        <div id="stubBanner" class="hidden mb-4 p-3 rounded bg-yellow-600 text-gray-900"></div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="md:col-span-2">
            <label class="block mb-2">Programming Language</label>
            <select id="language" class="w-full p-2 rounded bg-gray-800 border border-gray-700 mb-4">
              <option>python</option>
              <option>javascript</option>
              <option>java</option>
              <option>c#</option>
              <option>go</option>
              <option>c++</option>
            </select>

            <label class="block mb-2">Paste your code</label>
            <textarea id="codeInput" rows="14" class="w-full p-3 rounded bg-gray-800 border border-gray-700 font-mono text-sm"></textarea>

            <div class="flex gap-2 mt-3">
              <button id="reviewBtn" class="px-4 py-2 bg-blue-600 rounded hover:bg-blue-500">Review</button>
              <button id="rewriteBtn" class="px-4 py-2 bg-green-600 rounded hover:bg-green-500">Rewrite</button>
            </div>
          </div>

          <div class="md:col-span-1">
            <div id="scores" class="bg-gray-800 p-4 rounded">
              <h2 class="text-xl font-semibold mb-2">Overall Score</h2>
              <div class="text-4xl font-bold" id="overallScore">--</div>
              <div class="mt-3">
                <div id="breakdown" class="space-y-2 text-sm opacity-90"></div>
              </div>
              <div class="mt-4">
                <label class="block mb-2">Improvement</label>
                <div class="w-full bg-gray-700 rounded h-4">
                  <div id="improveBar" class="h-4 bg-green-400 rounded" style="width:0%"></div>
                </div>
                <div class="mt-2 text-sm" id="improveText">--</div>
              </div>
            </div>
          </div>
        </div>

        <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-gray-800 p-4 rounded">
            <h3 class="font-semibold mb-2">Analysis & Issues</h3>
            <div id="analysis" class="prose prose-invert max-w-none"></div>
          </div>

          <div class="bg-gray-800 p-4 rounded">
            <h3 class="font-semibold mb-2">Rewritten Code</h3>
            <pre><code id="rewrittenCode" class="hljs language-python"></code></pre>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
